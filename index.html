<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat สุ่มคนคุย</title>
    <!-- ดึง Supabase มาใช้งาน -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ส่วนตกแต่งหน้าตา (CSS) -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .container {
            background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%; max-width: 400px; text-align: center;
        }
        h1 { font-size: 22px; margin-bottom: 20px; color: #222; }
        .user-info {
            background: #e9ecef; padding: 15px; border-radius: 10px;
            margin-bottom: 20px; font-weight: 500; font-size: 16px;
        }
        .card {
            border: 1px solid #eee; padding: 20px; border-radius: 10px; background: #fafafa;
        }
        #status { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #555; }
        button {
            width: 100%; padding: 14px; margin: 8px 0; border: none;
            border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ ระบบสุ่มคนคุย (Voice Chat)</h1>
        
        <!-- กล่องแสดงข้อมูลตัวเรา -->
        <div id="userInfo" class="user-info">
            กำลังเชื่อมต่อระบบ...
        </div>

        <!-- กล่องควบคุมการคุย -->
        <div class="card">
            <p id="status">สถานะ: รอคำสั่ง</p>
            <button id="startBtn" class="btn-primary" disabled>รอสักครู่...</button>
            <button id="skipBtn" class="btn-danger" style="display: none;">⏭️ ปัด / เปลี่ยนคน</button>
            <button id="stopBtn" class="btn-secondary" style="display: none;">⏹️ เลิกคุย</button>
        </div>
        
        <!-- ลำโพงสำหรับเล่นเสียงอีกฝั่ง -->
        <audio id="remoteAudio" autoplay></audio>
    </div>

    <!-- ส่วนระบบทำงาน (JavaScript) -->
    <script>
        // 1. ตั้งค่า Supabase ด้วย API ของคุณ
        const SUPABASE_URL = 'https://vyvuhwnhgcmbokkshnxo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5dnVod25oZ2NtYm9ra3NobnhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjU1MDIsImV4cCI6MjEwMzYwMTUwMn0.FYzIS30XtiPNaBRxv6VaS6VOG4hRmP1rFljFINwm_do';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let user = null;
        let localStream = null;
        let peerConnection = null;
        let signalingChannel = null;

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');
        const stopBtn = document.getElementById('stopBtn');
        const remoteAudio = document.getElementById('remoteAudio');

        // 2. ล็อกอินเมื่อเข้าเว็บ
        async function initApp() {
            try {
                // ล็อกอินแบบไม่ต้องกรอกรหัส
                const { data, error } = await supabase.auth.signInAnonymously();
                if (error) throw error;
                user = data.user;

                // ดึงประเทศ (ถ้าดึงไม่ได้ให้ใช้ Unknown)
                let country = 'Unknown';
                try {
                    const res = await fetch('https://ipapi.co/json/');
                    country = (await res.json()).country_name || 'Unknown';
                } catch (e) { console.log('ข้ามการดึงประเทศ'); }

                // โชว์หน้าเว็บเลย ไม่ต้องรอเซฟลงฐานข้อมูล
                document.getElementById('userInfo').innerHTML = `👤 Guest_${user.id.substring(0,4)} <br> 🌍 ประเทศ: ${country}`;
                startBtn.innerText = "1. เปิดไมค์ & เริ่มหาคนคุย";
                startBtn.disabled = false;

                // แอบเซฟข้อมูลเงียบๆ เผื่อฐานข้อมูลยังไม่ได้สร้างจะได้ไม่ค้าง
                supabase.from('profiles').upsert({ id: user.id, country: country }).then();

            } catch (err) {
                document.getElementById('userInfo').innerHTML = `❌ ระบบขัดข้อง โปรดรีเฟรชหน้าเว็บ`;
                console.error("Login Error:", err);
            }
        }

        // 3. เริ่มหาคู่
        async function startMatchmaking() {
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch (err) {
                    return alert('คุณต้องกด "อนุญาต" ไมโครโฟนก่อนครับ ระบบถึงจะทำงานได้!');
                }
            }

            startBtn.style.display = 'none';
            skipBtn.style.display = 'block';
            stopBtn.style.display = 'block';
            statusEl.innerText = '🔍 กำลังหาคนว่าง...';
            statusEl.style.color = '#007bff';

            // ลบตัวเองออกจากคิวเก่าก่อน (กันบั๊ก)
            await supabase.from('waiting_queue').delete().eq('user_id', user.id);

            // หาคนในคิว
            const { data: queue } = await supabase.from('waiting_queue').select('*').neq('user_id', user.id).limit(1);

            if (queue && queue.length > 0) {
                const partnerId = queue[0].user_id;
                await supabase.from('waiting_queue').delete().eq('user_id', partnerId);
                setupWebRTC(partnerId, true);
            } else {
                await supabase.from('waiting_queue').upsert({ user_id: user.id });
                setupWebRTC(user.id, false);
            }
        }

        // 4. เชื่อมต่อ WebRTC
        function setupWebRTC(roomId, isCaller) {
            if (peerConnection) peerConnection.close();
            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteAudio.srcObject = event.streams[0];
                statusEl.innerText = '🟢 กำลังคุยอยู่!';
                statusEl.style.color = '#28a745';
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && signalingChannel) {
                    signalingChannel.send({ type: 'broadcast', event: 'signal', payload: { candidate: event.candidate } });
                }
            };

            signalingChannel = supabase.channel(`room_${roomId}`);

            signalingChannel.on('broadcast', { event: 'signal' }, async (msg) => {
                const data = msg.payload;
                if (data.offer && !isCaller) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    signalingChannel.send({ type: 'broadcast', event: 'signal', payload: { answer: answer } });
                }
                if (data.answer && isCaller) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                if (data.candidate) try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
            }).subscribe(async (status) => {
                if (status === 'SUBSCRIBED' && isCaller) {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    signalingChannel.send({ type: 'broadcast', event: 'signal', payload: { offer: offer } });
                }
            });
        }

        // 5. ปัดคนทิ้ง
        async function skipMatch() {
            cleanup();
            await supabase.from('waiting_queue').delete().eq('user_id', user.id);
            startMatchmaking();
        }

        // 6. เลิกคุย
        async function stopMatch() {
            cleanup();
            await supabase.from('waiting_queue').delete().eq('user_id', user.id);
            startBtn.style.display = 'block';
            skipBtn.style.display = 'none';
            stopBtn.style.display = 'none';
            statusEl.innerText = 'สถานะ: รอคำสั่ง';
            statusEl.style.color = '#555';
        }

        function cleanup() {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (signalingChannel) { supabase.removeChannel(signalingChannel); signalingChannel = null; }
            remoteAudio.srcObject = null;
        }

        startBtn.addEventListener('click', startMatchmaking);
        skipBtn.addEventListener('click', skipMatch);
        stopBtn.addEventListener('click', stopMatch);

        window.onload = initApp;
    </script>
</body>
</html>
