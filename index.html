<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audyssey.so - ระบบสนทนาออนไลน์</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- ตั้งค่าพื้นฐาน (Dark & Formal) --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: #050505; color: #f0f0f0; height: 100vh; overflow: hidden;
            user-select: none; 
        }

        .noise-bg {
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.06"/%3E%3C/svg%3E');
        }

        /* --- หน้า Home Screen --- */
        #homeScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; padding: 20px; text-align: center;
        }
        
        .logo { font-size: 46px; font-weight: 700; margin-bottom: 35px; letter-spacing: 0.5px; color: #fff; }
        
        .btn-main {
            width: 100%; max-width: 360px; padding: 18px; margin: 8px 0;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; color: #fff; font-size: 16px; font-weight: 500;
            cursor: pointer; backdrop-filter: blur(10px); transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .btn-main:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.4); }
        .btn-main:disabled { opacity: 0.3; cursor: not-allowed; }

        .online-count { 
            font-size: 14px; margin-top: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #aaa;
        }
        .dot { width: 10px; height: 10px; background-color: #39ff14; border-radius: 50%; box-shadow: 0 0 8px #39ff14; }

        /* --- หน้า Chat Screen (จอแยก) --- */
        #chatScreen { display: none; width: 100vw; height: 100vh; position: relative; }
        .split-view { display: flex; width: 100%; height: 100%; }
        
        .panel-left { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .panel-right { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
            background-color: #000;
        }

        .btn-settings { position: absolute; top: 25px; right: 25px; padding: 8px 18px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; color: #ddd; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s;}
        .btn-settings:hover { background: rgba(255, 255, 255, 0.15); color: #fff;}
        
        .profile-bar { position: absolute; bottom: 35px; display: flex; gap: 15px; width: 100%; justify-content: center; padding: 0 20px; }
        .btn-info { padding: 12px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; color: #ccc; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; flex: 1; max-width: 180px; justify-content: center; transition: 0.2s;}
        .btn-info:hover { background: rgba(255, 255, 255, 0.1); color: #fff;}

        .waveform-container { width: 100%; max-width: 500px; height: 150px; display: flex; justify-content: center; align-items: center; }
        .waveform { width: 100%; height: 100%; }

        .status-container { position: absolute; top: 35px; text-align: center; width: 100%; }
        .status-text { font-size: 13px; color: #888; font-weight: 500; letter-spacing: 0.5px; }

        .my-controls { position: absolute; bottom: 35px; width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 40px; }
        .warning-text { font-size: 11px; color: #666; text-align: center; max-width: 70%; line-height: 1.6; margin: 0 auto; font-weight: 400;}
        
        .mic-btn { 
            background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            width: 50px; height: 50px; border-radius: 50%; transition: all 0.2s;
        }
        .mic-btn svg { width: 26px; height: 26px; fill: #ddd; transition: 0.2s;}
        .mic-btn:hover svg { fill: #fff; }
        .mic-off svg { fill: #dc3545; }

        .swipe-hint { position: absolute; top: 65px; right: 25px; font-size: 12px; color: #777; display: flex; align-items: center; gap: 6px; opacity: 0.8; font-weight: 500;}
        .btn-report { position: absolute; top: 25px; left: 25px; padding: 6px 14px; background: transparent; border: 1px solid #333; color: #666; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s;}
        .btn-report:hover { background: rgba(220, 53, 69, 0.1); border-color: #dc3545; color: #dc3545; }

        /* --- Modal (Popup) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px);}
        .modal-content { background: #121212; padding: 30px; border-radius: 10px; width: 90%; max-width: 360px; border: 1px solid #2a2a2a; text-align: left; }
        .modal-content h2 { margin-bottom: 20px; text-align: center; font-size: 18px; font-weight: 600; color: #eee;}
        .modal-content label { display: block; font-size: 12px; color: #888; margin-bottom: 8px;}
        .modal-content select { width: 100%; padding: 12px; margin-bottom: 20px; background: #0a0a0a; color: #ddd; border: 1px solid #333; border-radius: 6px; font-size: 14px; outline: none;}
        .modal-content select:focus { border-color: #555; }
        .modal-btn { width: 100%; padding: 14px; background: #eee; color: #000; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; transition: 0.2s;}
        .modal-btn:hover { background: #fff; }

        @media (max-width: 768px) {
            .split-view { flex-direction: column; }
            .panel-left, .panel-right { height: 50%; border-right: none; }
            .panel-left { border-bottom: 1px solid rgba(255,255,255,0.1); }
            .my-controls { padding: 0 25px; bottom: 25px; }
            .profile-bar { bottom: 25px; padding: 0 15px; }
            .warning-text { font-size: 10px; max-width: 75%; }
        }
    </style>
</head>
<body>

    <!-- หน้าแรก (Home Screen) -->
    <div id="homeScreen" class="noise-bg">
        <div class="logo">Audyssey.so</div>
        
        <button id="startBtn" class="btn-main" onclick="enterChatScreen()" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            สนทนาแบบสุ่มคู่สนทนา
        </button>
        <button class="btn-main" onclick="alert('ระบบสนทนากลุ่มอยู่ระหว่างการพัฒนา')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            สนทนาแบบกลุ่ม
        </button>

        <div class="online-count">
            <div class="dot"></div>
            <span id="onlineCountText">กำลังเชื่อมต่อระบบ...</span>
        </div>
    </div>

    <!-- หน้าสนทนา (Chat Screen) -->
    <div id="chatScreen">
        <div class="split-view">
            <!-- ซ้าย -->
            <div class="panel-left noise-bg">
                <div class="logo" style="font-size: 34px; margin-bottom: 10px;">Audyssey.so</div>
                <div class="online-count" style="margin-top: 0; margin-bottom: 30px;">
                    <div class="dot"></div>
                    <span id="innerOnlineCountText">กำลังเชื่อมต่อ...</span>
                </div>
                <button class="btn-settings" onclick="openModal('settingsModal')">ปรับแก้</button>
                
                <div class="profile-bar">
                    <button class="btn-info" onclick="openModal('settingsModal')">ประเทศ <span id="myCountryFlag">🇹🇭</span></button>
                    <button class="btn-info" onclick="openModal('genderModal')">เพศ <span id="myGenderText" style="font-size:12px;">(ไม่ระบุ)</span></button>
                </div>
            </div>

            <!-- ขวา -->
            <div class="panel-right">
                <button class="btn-report" onclick="reportUser()" style="display:none;" id="reportBtn">รายงานบุคคล</button>
                <div class="swipe-hint" id="swipeHint">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><polyline points="12 19 5 12 12 5"></polyline></svg>
                    ปัดซ้ายเพื่อสนทนา
                </div>
                
                <div class="status-container">
                    <p class="status-text" id="chatStatusText">ระบบพร้อมทำงาน ปัดหน้าจอไปทางซ้ายเพื่อเริ่มต้น</p>
                </div>

                <div class="waveform-container">
                    <canvas id="mainWaveform" class="waveform"></canvas>
                </div>
                
                <div class="my-controls">
                    <div style="width: 50px;"></div> 
                    <p class="warning-text">โดยการใช้เสียงแชทนี้ คุณยอมรับกฎของเรา ผู้ฝ่าฝืนกฎจะถูกแบน<br>พยายามให้มีการสนทนาของคุณปรากฏในช่องสนทนานี้</p>
                    
                    <button id="micToggleBtn" class="mic-btn mic-off" onclick="toggleMic()" title="คลิกเพื่ออนุญาตไมโครโฟน">
                        <svg id="micIcon" viewBox="0 0 24 24">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <audio id="remoteAudio" autoplay></audio>
    </div>

    <!-- Modals -->
    <div id="genderModal" class="modal">
        <div class="modal-content">
            <h2>ข้อมูลส่วนบุคคล</h2>
            <label>ระบุเพศเพื่อการแสดงผลที่แม่นยำ</label>
            <select id="myGenderSelect">
                <option value="unspecified">ไม่ระบุ</option>
                <option value="male">ชาย</option>
                <option value="female">หญิง</option>
            </select>
            <button class="modal-btn" onclick="saveMyProfile()">ยืนยัน</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>ปรับแก้การค้นหา</h2>
            
            <label>ความต้องการคู่สนทนา (เพศ)</label>
            <select id="prefGenderSelect">
                <option value="all">ทุกเพศ (ค่าเริ่มต้น)</option>
                <option value="male">เฉพาะผู้ชาย</option>
                <option value="female">เฉพาะผู้หญิง</option>
            </select>

            <label>ความต้องการคู่สนทนา (ภูมิภาค/ประเทศ)</label>
            <select id="prefCountrySelect">
                <option value="all">ทั่วโลก 🌍</option>
                <!-- ตัวเลือกประเทศ 195 ประเทศจะถูกโหลดลงตรงนี้อัตโนมัติ -->
            </select>
            
            <button class="modal-btn" onclick="saveSettings()">บันทึกการตั้งค่า</button>
        </div>
    </div>

        async function toggleMic() {
            const micBtn = document.getElementById('micToggleBtn');
            
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    isMicMuted = false;
                    micBtn.classList.remove('mic-off');
                    
                    if (!peerConnection) initWaveform('mainWaveform', localStream);
                    
                    if (peerConnection && signalingChannel) {
                        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                        const offer = await peerConnection.createOffer();
                        await peerConnection.setLocalDescription(offer);
                        signalingChannel.send({ type: 'broadcast', event: 'signal', payload: { offer: offer } });
                    }
                } catch (err) {
                    alert('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตเพื่อส่งเสียงสนทนา');
                }
                return;
            }

            isMicMuted = !isMicMuted;
            localStream.getAudioTracks()[0].enabled = !isMicMuted;
            micBtn.classList.toggle('mic-off', isMicMuted);
        }

        document.getElementById('chatScreen').addEventListener('mousedown', e => { mousedownX = e.screenX; });

        // --- 7. ระบบค้นหาและจับคู่ ---
        async function startMatchmaking() {
            reportBtn.style.display = 'none';
            chatStatusText.innerText = 'กำลังค้นหาการเชื่อมต่อ...';
            drawFlatWaveform();

            await sb.from('waiting_queue').delete().eq('user_id', user.id);

            let query = sb.from('waiting_queue').select('*').neq('user_id', user.id);
            if (prefGender !== 'all') query = query.eq('user_gender', prefGender);
            if (prefCountry !== 'all') query = query.eq('user_country', prefCountry);

            const { data: queue } = await query.limit(1);

            if (queue && queue.length > 0) {
                partnerId = queue[0].user_id;
                currentRoomId = partnerId;
                await sb.from('waiting_queue').delete().eq('user_id', partnerId);
                setupWebRTC(partnerId, true);
            } else {
                currentRoomId = user.id;
                await sb.from('waiting_queue').upsert({ user_id: user.id, user_gender: myGender, user_country: myCountry });
                setupWebRTC(user.id, false);
            }
        }

        function setupWebRTC(roomId, isCaller) {
            if (peerConnection) peerConnection.close();
            peerConnection = new RTCPeerConnection(rtcConfig);

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = (event) => {
                remoteAudio.srcObject = event.streams[0];
                chatStatusText.innerText = 'การเชื่อมต่อสำเร็จ กำลังสนทนา';
                reportBtn.style.display = 'block';
                initWaveform('mainWaveform', event.streams[0]);
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && signalingChannel) signalingChannel.send({ type: 'broadcast', event: 'signal', payload: { candidate: event.candidate } });
            };

            signalingChannel = sb.channel(`room_${roomId}`);

            signalingChannel.on('broadcast', { event: 'signal' }, async (msg) => {
                const data = msg.payload;
                if (data.action === 'skip') { cleanupConnection(); startMatchmaking(); return; }

                if (data.offer && !isCaller) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    signalingChannel.send({ type: 'broadcast', event: 'signal', payload: { answer: answer } });
                }
                if (data.answer && isCaller) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                if (data.candidate) try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
            }).subscribe(async (status) => {
                if (status === 'SUBSCRIBED' && isCaller) {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    signalingChannel.send({ type: 'broadcast', event: 'signal', payload: { offer: offer } });
                }
            });
        }

        async function skipMatch() { 
            if (signalingChannel) signalingChannel.send({ type: 'broadcast', event: 'signal', payload: { action: 'skip' } });
            cleanupConnection(); 
            if (user) await sb.from('waiting_queue').delete().eq('user_id', user.id); 
            startMatchmaking(); 
        }

        function cleanupConnection() {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (signalingChannel) { sb.removeChannel(signalingChannel); signalingChannel = null; }
            remoteAudio.srcObject = null;
            partnerId = null;
            reportBtn.style.display = 'none';
            if (localStream) initWaveform('mainWaveform', localStream); 
            else drawFlatWaveform();
        }

        async function reportUser() {
            if (!partnerId) return;
            if (confirm('ยืนยันการรายงานผู้ใช้รายนี้ว่ากระทำผิดกฎ? (ระบบจะตัดการเชื่อมต่อทันที)')) {
                await sb.from('reports').insert({ reporter_id: user.id, reported_user_id: partnerId, room_id: `room_${currentRoomId}` });
                skipMatch();
            }
        }

        function getFlagEmoji(countryCode) {
            if(!countryCode) return '🏳️';
            const codePoints = countryCode.toUpperCase().split('').map(char =>  127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }

        // --- 9. คลื่นเสียง (Waveform) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let animationId;
        
        function drawFlatWaveform() {
            cancelAnimationFrame(animationId);
            const canvas = document.getElementById('mainWaveform');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height/2);
            ctx.lineTo(canvas.width, canvas.height/2);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function initWaveform(canvasId, stream) {
            cancelAnimationFrame(animationId);
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            
            const analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                if(!stream.active) { drawFlatWaveform(); return; }
                animationId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.beginPath();
                
                let sliceWidth = canvas.width * 1.0 / bufferLength;
                let x = 0;
                
                for(let i = 0; i < bufferLength; i++) {
                    let v = dataArray[i] / 128.0; 
                    let y = v * canvas.height / 2;
                    if(i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                ctx.lineTo(canvas.width, canvas.height/2);
                ctx.stroke();
            }
            draw();
        }
